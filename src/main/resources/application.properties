spring.application.name=mams-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/mams?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.sql.init.mode=always

app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-ms=86400000

server.error.include-message=always
spring.jpa.open-in-view=false